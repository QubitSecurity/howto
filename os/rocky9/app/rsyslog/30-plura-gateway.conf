# PLURA-XDR Syslog Gateway / Go Sender v0.5.0 / Active-Active
# Gateway 1: 192.168.200.200
# HAProxy backend SOURCE IP: 192.168.10.25
#
# MSA -> HAProxy (TCP/514) -> rsyslog (TCP/514) -> omprog -> Go Sender
# Go Sender -> customer Syslog server (TCP/UDP, as specified in RFC5424 SD)
#
# Install: /etc/rsyslog.d/30-plura-gateway.conf
# Keep /etc/rsyslog.conf as-is. Do not load modules twice.
# Gateway 2: change 192.168.200.200 to Gateway 2's own IP.
# This is a memory-queue PoC: undelivered events can be lost on crash/restart.

module(load="impstats" interval="30" format="json"
       log.syslog="off" log.file="/var/log/plura/rsyslog-stats.jsonl")
global(maxMessageSize="8k" parser.escapeControlCharactersOnReceive="off")
module(load="imtcp")
module(load="omprog")

# JSONL stdin envelope for the existing Go Sender. Preserve original Syslog.
template(name="pluraOmprogEnvelope" type="string"
    string="{\"app\":\"%app-name:::json%\",\"raw\":\"%rawmsg:::json%\",\"source\":\"%fromhost-ip:::json%\"}\n")

# Log only rejection metadata, not the customer's Syslog payload.
template(name="pluraRejectMeta" type="string"
    string="{\"time\":\"%timegenerated:::date-rfc3339%\",\"event\":\"ingress_rejected\",\"source\":\"%fromhost-ip:::json%\",\"app\":\"%app-name:::json%\"}\n")

ruleset(name="plura_gateway") {
    # Business logs: only HAProxy TCP source + plura-relay APP-NAME.
    # Local health probe: only this Gateway's own source + plura-health.
    # BOTH cases use the SAME omprog action and memory queue.
    if (($fromhost-ip == "192.168.10.25" and $app-name == "plura-relay") or
        ($fromhost-ip == "192.168.200.200" and $app-name == "plura-health")) then {
        action(
            name="plura_dynamic_sender"
            type="omprog"
            binary="/usr/libexec/rsyslog/plura-syslog-sender -config /etc/plura-syslog/sender.json"
            template="pluraOmprogEnvelope"
            confirmMessages="on"
            confirmTimeout="30000"
            forceSingleInstance="on"
            signalOnClose="off"
            closeTimeout="5000"
            killUnresponsive="on"
            output="/var/log/plura/sender.log"
            fileCreateMode="0640"
            queue.type="LinkedList"
            queue.size="10000"
            queue.workerThreads="1"
            queue.dequeueBatchSize="1"
            queue.timeoutEnqueue="1000"
            action.resumeRetryCount="-1"
            action.resumeInterval="5"
            action.reportSuspension="on"
            action.reportSuspensionContinuation="on"
        )
        stop
    }

    action(type="omfile" file="/var/log/plura/rejected.log"
           template="pluraRejectMeta" fileCreateMode="0640")
    stop
}

# HAProxy -> Gateway is Syslog TCP, NOT the legacy HTTP receiver.
# Both normal Syslog data and local health checks arrive here.
input(type="imtcp" address="192.168.200.200" port="514"
      name="plura_tcp_ingress" ruleset="plura_gateway"
      SupportOctetCountedFraming="on")
