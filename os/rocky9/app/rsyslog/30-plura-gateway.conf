# PLURA-XDR / rsyslog Gateway / Active-Active / Go Sender 0.4.1-ha
# 설치 위치: /etc/rsyslog.d/30-plura-gateway.conf
# 기존 /etc/rsyslog.conf는 유지합니다. 이 파일은 PLURA용 전체 추가 설정입니다.
#
# 수정 1: <HAPROXY_SOURCE_IP>를 HAProxy의 Gateway 방향 실제 송신 IP로 교체.
#         HAProxy config의 'source' 값과 일치해야 합니다. MSA IP가 아닙니다.
# 수정 2: Gateway 2에서는 아래 192.168.200.200을 모두 해당 Gateway 내부 IP로 교체.
#         Gateway 1은 192.168.200.200 그대로 사용합니다.
#
# 두 Gateway에 같은 역할로 설치합니다. 주/대기 구분, 고객별 목적지 conf 없음.
# 내부 수신 TCP/514, 고객 송신 TCP/UDP는 Go Sender가 결정합니다.
# TCP/18081 /ready는 rsyslog가 아니라 기존 plura-syslog-health 서비스가 제공합니다.
# 모듈 중복 로드, 기존 TCP/514 listener 중복을 먼저 해소하십시오.
# Go 설정의 allowedSourceIps 및 상태 점검 주소도 이 파일과 일치해야 합니다.
# 메모리 큐: 영속 저장/서버 간 복제 없음. 고객 장애가 공통 큐를 지연시킬 수 있습니다.

module(load="impstats" interval="30" format="json"
       log.syslog="off" log.file="/var/log/plura/rsyslog-stats.jsonl")
global(maxMessageSize="8k" parser.escapeControlCharactersOnReceive="off")
module(load="imtcp")
module(load="omprog")

template(name="pluraOmprogEnvelope" type="string"
    string="{\"app\":\"%app-name:::json%\",\"raw\":\"%rawmsg:::json%\",\"source\":\"%fromhost-ip:::json%\"}\n")
template(name="pluraRejectMeta" type="string"
    string="{\"time\":\"%timegenerated:::date-rfc3339%\",\"event\":\"ingress_rejected\",\"source\":\"%fromhost-ip:::json%\",\"app\":\"%app-name:::json%\"}\n")

ruleset(name="plura_gateway") {
    # The LB creates a new TCP connection: business source is now LB_SOURCE_IP.
    # Local health probes enter the same action and queue, never a shortcut.
    if (($app-name == "plura-relay" and $fromhost-ip == "<HAPROXY_SOURCE_IP>") or
        ($app-name == "plura-health" and $fromhost-ip == "192.168.200.200")) then {
        action(name="plura_dynamic_sender" type="omprog"
            binary="/usr/libexec/rsyslog/plura-syslog-sender -config /etc/plura-syslog/sender.json"
            template="pluraOmprogEnvelope"
            confirmMessages="on" confirmTimeout="30000"
            forceSingleInstance="on" signalOnClose="off"
            closeTimeout="5000" killUnresponsive="on"
            output="/var/log/plura/sender.log" fileCreateMode="0640"
            queue.type="LinkedList" queue.size="10000"
            queue.workerThreads="1" queue.dequeueBatchSize="1"
            queue.timeoutEnqueue="1000"
            action.resumeRetryCount="-1" action.resumeInterval="5"
            action.reportSuspension="on" action.reportSuspensionContinuation="on"
        )
        stop
    }
    action(type="omfile" file="/var/log/plura/rejected.log"
           template="pluraRejectMeta" fileCreateMode="0640")
    stop
}
# TCP-only internal HA path. Customer egress can STILL be UDP or TCP.
# TCP port 514 here is SYSLOG, not the old HTTP receiver.
input(type="imtcp" address="192.168.200.200" port="514"
      name="plura_tcp_ingress" ruleset="plura_gateway"
      SupportOctetCountedFraming="on")
