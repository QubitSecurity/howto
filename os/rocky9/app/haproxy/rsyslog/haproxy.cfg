# PLURA-XDR / HAProxy 3.2+ / Active-Active
# 아래 3개 값을 실제 IP로 교체: <HAPROXY_LISTEN_IP>, <HAPROXY_SOURCE_IP>, <GATEWAY2_IP>
# TCP/514 = Syslog. TCP/18081 = Gateway 상태 확인 전용.
# 신규 전용 LB용 전체 설정. 기존 메일 LB에는 frontend/backend만 검토 후 병합.
global
    log stdout format raw local0
    maxconn 4096
    user haproxy
    group haproxy
    stats socket /run/plura-haproxy/admin.sock mode 600 level admin

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 2s
    timeout client 5m
    timeout server 5m
    timeout check 2s
    timeout queue 2s
    retries 2

frontend plura_syslog_tcp
    bind <HAPROXY_LISTEN_IP>:514
    mode tcp
    option tcplog
    option clitcpka
    timeout client 5m
    acl plura_msa src 192.168.1.15/32
    tcp-request connection reject unless plura_msa
    tcp-request connection reject if { nbsrv(plura_syslog_gateways) eq 0 }
    default_backend plura_syslog_gateways

backend plura_syslog_gateways
    mode tcp
    balance leastconn
    source <HAPROXY_SOURCE_IP>
    option srvtcpka
    option redispatch
    option log-health-checks
    option tcp-check

    # 두 검사를 모두 통과한 Gateway만 사용. 기존 v0.4.1-ha /ready 서비스 필요.
    tcp-check connect port 514 linger
    tcp-check connect port 18081
    tcp-check send GET\ /ready\ HTTP/1.0\r\nHost:\ plura-gateway\r\n\r\n
    tcp-check expect string HTTP/1.0\ 200

    timeout connect 2s
    timeout server 5m
    timeout check 2s
    timeout queue 2s
    retries 2
    default-server inter 2s fastinter 1s downinter 2s fall 2 rise 2 init-state fully-down on-marked-down shutdown-sessions

    # 두 대 모두 Active. backup 없음. 로그가 아닌 TCP 연결 단위 분산.
    server gw1 192.168.200.200:514 check weight 1
    server gw2 <GATEWAY2_IP>:514 check weight 1
    # 장애 시 기존 연결 종료 → MSA가 HAProxy에 재연결해야 함.
    # send-proxy 사용 안 함: Gateway에서 관측하는 송신자는 HAPROXY_SOURCE_IP.
